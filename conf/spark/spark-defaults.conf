# Ajustes de Spark independientes de la máquina. El master y la memoria llegan por PYSPARK_SUBMIT_ARGS
# (docker-compose.yml, a partir de .env); el código no fija ninguno de los dos.

# Planificación adaptativa: une particiones pequeñas tras cada shuffle y reparte las sesgadas.
spark.sql.adaptive.enabled                          true
spark.sql.adaptive.coalescePartitions.enabled       true
spark.sql.adaptive.skewJoin.enabled                 true
spark.sql.adaptive.advisoryPartitionSizeInBytes     128m
spark.sql.shuffle.partitions                        64
spark.sql.autoBroadcastJoinThreshold                64m
spark.sql.files.maxPartitionBytes                   128m

# HDFS de un solo datanode: sin esto el cliente pide tres réplicas y cada bloque queda sub-replicado.
spark.hadoop.dfs.replication                        1

spark.serializer                                    org.apache.spark.serializer.KryoSerializer
spark.ui.showConsoleProgress                        false
spark.sql.execution.arrow.pyspark.enabled           false

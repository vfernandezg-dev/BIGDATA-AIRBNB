# Registro de la JVM de Spark: solo avisos y errores. El pipeline registra su progreso desde Python.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}: %m%n%ex

# El cliente de Hadoop avisa de que no encuentra la librería nativa en cada arranque; no afecta al resultado.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

# Avisos repetitivos sin acción posible: el tamaño del modelo al difundirlo y los planes largos truncados.
logger.dagscheduler.name = org.apache.spark.scheduler.DAGScheduler
logger.dagscheduler.level = error
logger.stringutils.name = org.apache.spark.util.SparkStringUtils
logger.stringutils.level = error

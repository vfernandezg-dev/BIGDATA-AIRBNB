[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airbnb-lake"
version = "2.0.0"
description = "Pipeline batch multi-ciudad de Inside Airbnb sobre Apache Spark y HDFS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# La imagen de Docker ya trae Spark; este extra es para CI y para un entorno local opcional.
spark = ["pyspark==4.2.1"]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
airbnb-lake = "airbnb_lake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airbnb_lake = ["serving/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pyspark.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = [
    "RUF001", # los textos en español usan caracteres que ruff considera ambiguos
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["airbnb_lake", "tests"]

[tool.ruff.lint.per-file-ignores]
# Los tests usan tablas de datos y HTML de ejemplo que se leen mejor en una sola línea.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "py4j.*"]
ignore_missing_imports = true
follow_imports = "skip"
